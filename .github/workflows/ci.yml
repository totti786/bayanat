name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./e2e.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Start server
        run: npm run start & npx wait-on http://localhost:3000/login

      - name: Core e2e
        run: node scripts/e2e.mjs

      - name: Growth e2e
        run: node scripts/e2e-growth.mjs

      - name: Signature e2e
        run: node scripts/e2e-sign.mjs
